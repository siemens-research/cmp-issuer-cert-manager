    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: cmp-external-issuer
    control-plane: controller-manager
  name: cmp-issuer-controller-manager-metrics-service
  namespace: cmp-issuer-poc
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    app.kubernetes.io/name: cmp-external-issuer
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: cmp-external-issuer
    control-plane: controller-manager
  name: cmp-issuer-controller-manager
  namespace: cmp-issuer-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cmp-external-issuer
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: cmp-external-issuer
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        image: cmp-issuer-poc/cmp-controller:v0.0.0
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports: []
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cmp-issuer-controller-manager
      terminationGracePeriodSeconds: 10
      volumes: []
