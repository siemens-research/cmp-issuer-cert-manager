# This rule is not used by the project cmp-external-issuer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over cmp-issuer.siemens.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cmp-external-issuer
    app.kubernetes.io/managed-by: kustomize
  name: cmpissuer-admin-role
rules:
- apiGroups:
  - cmp-issuer.siemens.com
  resources:
  - cmpissuers
  verbs:
  - '*'
- apiGroups:
  - cmp-issuer.siemens.com
  resources:
  - cmpissuers/status
  verbs:
  - get
