# bind the cert-manager internal approver to approve
# cmp-issuer.siemens.com CertificateRequests
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-controller-approve:cmp-issuer-siemens-com
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-controller-approve:cmp-issuer-siemens-com
subjects:
- kind: ServiceAccount
  name: cert-manager
  namespace: cert-manager
